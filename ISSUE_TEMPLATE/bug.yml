name: Bug
description: The compiler or validator misbehaves
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and the exact error output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command, spec package, target language, and adapter.
    validations:
      required: true
